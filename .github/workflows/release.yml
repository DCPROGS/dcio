# Publishing dcio to PyPI.
#
# The repository holds no API token. PyPI verifies this workflow's OIDC
# identity instead (Trusted Publishing), which means there is no secret to
# leak, rotate, or hand to anyone.
#
# A version number cannot be reused once uploaded, so publishing runs only on
# a v* tag, never on an ordinary push. Every push still builds and checks the
# artifacts, so a tag is only ever cut from something already known to build.

name: Release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build sdist and wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # A tag that disagrees with the version it claims to publish names the
      # release one thing on GitHub and another on PyPI, and the number cannot
      # be taken back. SCALCS and HJCFIT both have this gate; dcio did not, and
      # 0.1.1 went out with dcio.__version__ still reading 0.1.0 -- a different
      # drift, now fixed at the source by deriving it from the metadata.
      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os, pathlib, re
          proj = re.search(r'^version = "([^"]+)"',
                           pathlib.Path('pyproject.toml').read_text(), re.M).group(1)
          tag = os.environ['GITHUB_REF'].removeprefix('refs/tags/v')
          if proj != tag:
              raise SystemExit(f'tag v{tag} does not match version {proj}')
          print('tag and version agree:', proj)
          PY

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      # The one thing a hardcoded __version__ could get wrong, asserted against
      # the built artifact rather than the source tree.
      - name: The wheel reports its own version
        run: |
          python -m venv /tmp/vcheck
          /tmp/vcheck/bin/pip install --quiet dist/*.whl
          /tmp/vcheck/bin/python - <<'PY'
          import re, pathlib, dcio
          proj = re.search(r'^version = "([^"]+)"',
                           pathlib.Path('pyproject.toml').read_text(), re.M).group(1)
          if dcio.__version__ != proj:
              raise SystemExit(f'wheel reports {dcio.__version__}, pyproject says {proj}')
          print('installed wheel reports', dcio.__version__)
          PY

      # twine check catches the metadata problems that make a PyPI page render
      # badly or an upload fail outright -- a README that is not valid
      # reStructuredText or Markdown, a missing long_description content type.
      - name: Check metadata
        run: |
          twine check --strict dist/*
          ls -la dist/

      # dcio is pure Python, so exactly one wheel serves every platform. If
      # that ever stops being true the wheel filename changes, and this notices.
      - name: One universal wheel
        run: |
          n=$(ls dist/*.whl | wc -l)
          test "$n" -eq 1 || { echo "expected 1 wheel, got $n"; exit 1; }
          ls dist/*-py3-none-any.whl >/dev/null || {
            echo "wheel is not py3-none-any:"; ls dist/*.whl; exit 1; }
          echo "one universal wheel, as expected"

      # The sdist must be able to build the wheel on its own: a file missing
      # from it is invisible until someone installs from source.
      - name: Wheel builds from the sdist alone
        run: |
          mkdir -p /tmp/fromsdist && tar -xzf dist/*.tar.gz -C /tmp/fromsdist
          cd /tmp/fromsdist/*/
          python -m build --wheel --outdir /tmp/sdist-wheel
          ls -la /tmp/sdist-wheel

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-24.04

    environment:
      name: pypi
      url: https://pypi.org/p/dcio

    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - name: What is about to be published
        run: ls -la dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
